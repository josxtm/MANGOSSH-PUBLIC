plugins { id 'com.android.application' }

android {
    namespace 'io.github.josxtm.mangossh.community'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.josxtm.mangossh.community'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-public'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/versions/**/OSGI-INF/**']
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
    testImplementation 'junit:junit:4.13.2'
}
