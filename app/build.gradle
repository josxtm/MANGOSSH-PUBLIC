    namespace 'io.github.josxtm.mangossh.community'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.josxtm.mangossh.community'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-public'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
