name: MangoSSH stable signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    # Never expose a signing credential to PRs or unreviewed feature branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: mangossh-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public-source privacy gate
        run: |
          python3 tools/privacy_guard.py .
          python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and verify signed release
        shell: bash
        env:
          STORE_B64: ${{ secrets.MANGOSSH_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MANGOSSH_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MANGOSSH_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MANGOSSH_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.MANGOSSH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$STORE_B64" || -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" || -z "$EXPECTED_CERT" ]]; then
            echo "Release signing not configured: no release artifact published."
            exit 1
          fi
          umask 077
          key_path="$RUNNER_TEMP/mangossh-signing.jks"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$STORE_B64" | base64 --decode > "$key_path"
          export MANGOSSH_KEYSTORE_PATH="$key_path"
          printf -v MANGOSSH_KEYSTORE_PASSWORD '%s' "$STORE_PASS"
          printf -v MANGOSSH_KEY_ALIAS '%s' "$KEY_ALIAS"
          printf -v MANGOSSH_KEY_PASSWORD '%s' "$KEY_PASS"
          export MANGOSSH_KEYSTORE_PASSWORD MANGOSSH_KEY_ALIAS MANGOSSH_KEY_PASSWORD
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PpublicCompilationNumber=$((200000 + GITHUB_RUN_NUMBER))
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep 'certificate SHA-256 digest:' | head -n 1 | awk '{print $NF}')
          if [[ "${actual,,}" != "${EXPECTED_CERT,,}" ]]; then
            echo "The certificate differs from the owner-approved fingerprint."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='io.github.josxtm.mangossh.community'"
          echo "PASS signed release identity and certificate (fingerprint withheld)"
      - name: Upload verified release
        uses: actions/upload-artifact@v4
        with:
          name: MANGOSSH-PUBLIC-SIGNED-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
